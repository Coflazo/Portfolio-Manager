[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-council"
version = "0.1.0"
description = "A unanimous model council with a persistent portfolio ledger and bounded free API usage"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "PyYAML>=6,<7", "websockets>=14,<17",
  "python-dotenv>=1,<2", "exchange-calendars>=4.5,<5",
]

[project.scripts]
portfolioctl = "portfolio_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pybind11>=2.13,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
